              properties:
                title: { type: string }
                year: { type: integer }
                genres:
                  type: array
                  items: { type: string }
                synopsis: { type: string }
                director: { type: string }
                expected_filename: { type: string, example: 'Film 2024 1080p.mkv' }
                publish: { type: boolean, description: 'true = PENDING + enqueue distribution; false = DRAFT' }
