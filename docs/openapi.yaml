        - adminAuth: []
      responses:
        '200': { description: Devices }

  /ws/tv:
    get:
      summary: Device WebSocket hub
      description: |
        Requires the device token as `?token=` or the `Authorization` header.

        Server to client events:

        * `WELCOME` — `{ device_id, tenant_id, room_id, server_time }`
        * `COMMAND` — `{ id, command, data }`, replayed for queued commands on connect
        * `REFRESH_CONFIG` — layout changed, refetch `/tv/init`
        * `ROOM_GUEST_UPDATED` — VIP guest changed, update the welcome screen
        * `ANNOUNCEMENT` — running text changed
        * `CONTENT_UPDATED` — catalog changed, refetch `/tv/init`
        * `APK_AVAILABLE` — a new TV package is downloadable

        Client to server events:

        * `HEARTBEAT` — `{ app_version, state }`
        * `ACK` — `{ command_id }`
        * `PING` — answered with `PONG`
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '101': { description: Switching protocols }

  /ws/remote:
    get:
      summary: Passenger phone remote WebSocket
      description: |
        The phone sends `{ type: "KEY", payload: { key: "UP"|"DOWN"|"LEFT"|"RIGHT"|"OK"|"BACK"|"PLAY_PAUSE" } }`
        and the hub forwards it to every TV in the room as a `KEY` event. The
        sender receives `KEY_ACK` with a delivery count.
      parameters:
        - name: room_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: tenant_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '101': { description: Switching protocols }
